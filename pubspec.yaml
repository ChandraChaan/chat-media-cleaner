name: chat_media_cleaner
description: "Chat Media Cleaner: find and clear large, duplicate and old chat-app media on your phone, privately on-device."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State management (see AGENTS.md).
  flutter_riverpod: ^3.4.3
  # Formatting sizes and dates for display.
  intl: ^0.20.2
  # Where the trash index file lives (app-private storage).
  path_provider: ^2.1.6
  # Small settings: retention days, age rule, chosen folders.
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

# Icons are rendered by test/tools/icon_test.dart; regenerate with
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/icon_square.png"
  adaptive_icon_background: "#3949AB"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  adaptive_icon_monochrome: "assets/brand/icon_monochrome.png"
  min_sdk_android: 26
